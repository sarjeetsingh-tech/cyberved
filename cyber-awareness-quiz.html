<!DOCTYPE html>
<html lang="en">
<head>

    <style>

            padding: 30px;

        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: rgb(204, 0, 0);
            font-size: 2.5rem;
            text-shadow: 0 0 10px #7a30ff;
            margin-bottom: 5px;
        }
        .logo-container {
            margin: auto;
            margin-top: 20px;
            margin-bottom: 20px;
        }
        .logo {
            filter: drop-shadow(0 0 8px rgba(8, 0, 55, 0.6));

        }
        .progress-container {
            margin-bottom: 20px;
        }
        .progress {
            height: 10px;
            background-color: rgba(255, 255, 255, 0.1);
        }
        .progress-bar {
            background-color: #e91e63;
        }
        .question-counter {
            text-align: right;
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        .question {
            font-size: 1.3rem;
            margin-bottom: 25px;

        }
        .options-container {

            margin-bottom: 30px;
        }
        .option-btn {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);

            text-align: left;

        .option-btn:hover {

        }
        .option-btn.selected {
            background-color: rgba(122, 48, 255, 0.3);
            border-color: #7a30ff;
            box-shadow: 0 0 10px rgba(122, 48, 255, 0.5);
        }
        .btn-primary {
            background-color: #e91e63;
            border: none;
            padding: 10px 30px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .btn-primary:hover {
            background-color: #c2185b;
        }
        .btn-primary:disabled {
            background-color: #6c757d;
            opacity: 0.65;
        }
        .result-container {
            text-align: center;
            display: none;
        }
        .result-title {
            font-size: 2rem;
            color: #e91e63;
            margin-bottom: 20px;
        }
        .score {
            font-size: 3rem;
            color: #ffcc00;
            margin-bottom: 30px;
        }
        .result-message {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }
        .certificate-btn {
            background-color: #28a745;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 20px;
        }
        .certificate-btn:hover {
            background-color: #218838;
        }
        .certificate-btn:disabled {
            background-color: #6c757d;
            opacity: 0.65;
        }
        .spinner-border {
            display: none;
            margin: 0 auto;
        }
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }
            .quiz-container {
                padding: 20px 15px;
                margin-top: 20px;
            }
            .question {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">

                        <img src="image.png" alt="Logo" class="img-fluid logo">

                <!-- Quiz Container -->
                <div id="quiz-container" class="quiz-container">

                        <div class="question-counter" id="question-counter">Question 1/10</div>
                        <div class="progress">
                            <div id="progress-bar" class="progress-bar" role="progressbar" style="width: 10%" aria-valuenow="10" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                    </div>
                    
                    <div id="question" class="question">Loading question...</div>
                    
                    <div id="options-container" class="options-container">
                        <!-- Options will be inserted here by JavaScript -->
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button id="next-button" class="btn btn-primary" disabled>Next Question</button>
                    </div>
                </div>
                
                <!-- Results Container -->
                <div id="result-container" class="result-container quiz-container">
                    <h2 class="result-title">Quiz Completed!</h2>
                    <p>Your Score:</p>
                    <div id="score" class="score">0/10</div>
                    <p id="result-message" class="result-message">Processing your results...</p>
                    
                    <div class="spinner-border text-light" id="loading-spinner" role="status">

                    </div>

                        <button id="get-certificate" class="certificate-btn" disabled>Get Your Certificate</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

                options: [

        let currentQuestion = 0;
        let score = 0;
        let userAnswers = [];

        // DOM elements
        const quizContainer = document.getElementById('quiz-container');
        const questionElement = document.getElementById('question');
        const optionsContainer = document.getElementById('options-container');
        const nextButton = document.getElementById('next-button');
        const progressBar = document.getElementById('progress-bar');
        const questionCounter = document.getElementById('question-counter');
        const resultContainer = document.getElementById('result-container');
        const scoreElement = document.getElementById('score');
        const certificateButton = document.getElementById('get-certificate');
        const loadingSpinner = document.getElementById('loading-spinner');

        // Initialize quiz
        function initializeQuiz() {
            displayQuestion();
            updateProgress();
            
            nextButton.addEventListener('click', handleNextQuestion);
            certificateButton.addEventListener('click', getCertificate);
        }

        // Display current question
        function displayQuestion() {
            const current = quizQuestions[currentQuestion];
            questionElement.textContent = `${currentQuestion + 1}. ${current.question}`;
            
            // Clear previous options
            optionsContainer.innerHTML = '';
            
            // Add options
            current.options.forEach((option, index) => {
                const optionButton = document.createElement('button');
                optionButton.className = 'option-btn';
                optionButton.textContent = option;
                optionButton.dataset.index = index;
                
                optionButton.addEventListener('click', () => selectOption(index));
                
                optionsContainer.appendChild(optionButton);
            });
            
            // Disable next button until an option is selected
            nextButton.disabled = true;
        }

        // Handle option selection
        function selectOption(index) {
            // Remove selected class from all options
            const options = document.querySelectorAll('.option-btn');
            options.forEach(option => option.classList.remove('selected'));
            
            // Add selected class to clicked option
            options[index].classList.add('selected');
            
            // Enable next button
            nextButton.disabled = false;
            
            // Store user's answer
            userAnswers[currentQuestion] = index;
        }

        // Handle next question button click
        function handleNextQuestion() {
            // Check if an option was selected
            if (nextButton.disabled) return;
            
            // Check if answer is correct
            if (userAnswers[currentQuestion] === quizQuestions[currentQuestion].correctAnswer) {
                score++;
            }
            
            // Move to next question or show results
            currentQuestion++;
            
            if (currentQuestion < quizQuestions.length) {
                displayQuestion();
                updateProgress();
            } else {
                showResults();
            }
        }

        // Update progress bar and counter
        function updateProgress() {
            const progress = ((currentQuestion + 1) / quizQuestions.length) * 100;
            progressBar.style.width = `${progress}%`;
            questionCounter.textContent = `Question ${currentQuestion + 1}/${quizQuestions.length}`;
        }

        // Show quiz results
        function showResults() {
            quizContainer.style.display = 'none';
            resultContainer.style.display = 'block';
            
            const percentage = (score / quizQuestions.length) * 100;
            scoreElement.textContent = `${score}/${quizQuestions.length} (${percentage.toFixed(0)}%)`;
            
            // Enable certificate button for all users who complete the test
            certificateButton.disabled = false;
            certificateButton.textContent = 'Get Your Certificate';
            document.getElementById('result-message').textContent = 'Thank you for completing the test. You can now get your certificate.';
            
            // Send results to server
            submitResults(score);
        }

        // Submit results to server
        function submitResults(finalScore) {
            fetch('/register/cyber-test/results', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ score: finalScore })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to submit results');
                }
                return response.json();
            })
            .then(data => {
                console.log('Results submitted successfully:', data);
            })
            .catch(error => {
                console.error('Error submitting results:', error);
            });
        }

        // Get certificate
        function getCertificate() {
            loadingSpinner.style.display = 'block';
            certificateButton.disabled = true;
            
            fetch('/register/cyber-test/verify', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to verify test completion');
                }
                return response.json();
            })
            .then(data => {
                if (data.eligible) {
                    // Show message about certificate download
                    document.getElementById('result-message').textContent = 'Your certificate is being downloaded. You will be redirected to the registration page.';
                    
                    // Store the certificate URL
                    const certificateUrl = `http://localhost:5000/register/cyber-test/certificate?token=${token}`;
                    
                    // Clear token immediately
                    try {
                        console.log('Removing token from session storage');
                        sessionStorage.removeItem('cyberTestToken');
                        console.log('Token removed successfully');
                    } catch (e) {
                        console.error('Error removing token:', e);
                    }
                    
                    // Open certificate in a new tab/window
                    window.open(certificateUrl, '_blank');
                    
                    // Add a button to manually return to registration
                    const resultContainer = document.getElementById('result-container');
                    const returnButton = document.createElement('button');
                    returnButton.className = 'btn btn-primary mt-3';
                    returnButton.textContent = 'Return to Registration';
                    returnButton.onclick = function() {
                        window.location.href = 'cyberawareness-test-registration.html';
                    };
                    resultContainer.appendChild(returnButton);
                    
                    // Also set a timeout to redirect automatically
                    setTimeout(() => {
                        window.location.href = 'cyberawareness-test-registration.html';
                    }, 5000); // Wait 5 seconds before redirecting
                } else {
                    document.getElementById('result-message').textContent = 'Error: Not eligible for certificate.';
                    loadingSpinner.style.display = 'none';
                    certificateButton.disabled = false;
                }
            })
            .catch(error => {
                console.error('Error getting certificate:', error);
                document.getElementById('result-message').textContent = 'Error retrieving certificate. Please try again.';
                loadingSpinner.style.display = 'none';
                certificateButton.disabled = false;
            });
        }

        // Start the quiz
        initializeQuiz();
    });
    </script>
</body>
